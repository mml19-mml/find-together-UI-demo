<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find Together · 原版 UI 交互演示</title><style>
*{box-sizing:border-box}body{margin:0;background:#eeede8;color:#36382e;font:13px/1.5 system-ui,'Microsoft YaHei',sans-serif}header{min-height:64px;background:#fbf9f1;border-bottom:1px solid #dedccd;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 24px;flex-wrap:wrap}.brand{font:600 20px Georgia,serif}.brand small{font:11px system-ui;color:#807961;margin-left:12px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{font:12px system-ui;background:#fbf9f1;color:#504933;border:1px solid #d9d5c6;border-radius:8px;padding:8px 10px;cursor:pointer}button:hover{background:#f5edcf}button:focus-visible,select:focus-visible{outline:2px solid #795900;outline-offset:2px}.primary{background:#f5ba13;border-color:#f5ba13}select{max-width:240px}.stage{display:flex;justify-content:center;align-items:flex-start;gap:28px;padding:25px 16px 12px}.viewport{width:390px;height:884px;flex:none;box-shadow:0 10px 35px #3332;overflow:hidden;background:#fbf9f1}iframe{width:100%;height:100%;border:0;display:block;background:#fbf9f1}.ref{width:390px;flex:none;position:relative}.ref img{width:100%;display:block;box-shadow:0 10px 35px #3332}.ref label{position:absolute;top:8px;right:8px;background:#fffdf4e8;padding:5px 9px;border-radius:8px;font-size:11px}footer{padding:8px 20px 24px;text-align:center;font-size:11px;color:#88816d}#notice{min-height:20px;color:#795900}.hidden{display:none!important}@media(max-width:820px){header{padding:10px 12px}.brand small{display:none}.stage{gap:12px}.stage.compare{flex-wrap:wrap}.controls{gap:5px}select{max-width:180px}}@media(max-width:430px){.stage{padding:0;display:block}.viewport{width:100%;height:calc(100dvh - 116px);min-height:650px;box-shadow:none}.ref{width:100%;margin-top:15px}header{min-height:116px;gap:7px}.controls{width:100%;justify-content:space-between}select{max-width:155px}footer{padding-top:14px}.brand{font-size:18px}}
</style></head><body><header><div class="brand">Find Together <small>原版 UI · 交互演示</small></div><div class="controls"><button id="back" aria-label="返回上一页">←</button><select id="pages" aria-label="选择原版界面"></select><button id="compare">原稿对照</button><button id="restart" class="primary">重新体验</button></div></header><main class="stage" id="stage"><div class="viewport"><iframe id="app" title="Find Together 原版界面" src="pages/01_home_device_binding.html"></iframe></div><div id="reference" class="ref hidden"><label>你提供的原始截图</label><img id="refImage" alt="当前页面的原始 UI 截图"></div></main><footer><div id="notice" role="status" aria-live="polite">点击界面中的按钮开始体验，或在顶部切换页面。</div>演示数据 · 不发送短信、拨号、报警或采集人脸 · 表单内容仅保留在当前会话</footer><script>
const catalog=[['onboarding_1_safety_monitoring','01 引导 · 安全监测'],['onboarding_2_mutual_rescue_network','02 引导 · 互助网络'],['onboarding_3_welcome_get_started','03 引导 · 欢迎开始'],['one_click_login_modal','04 一键登录'],['sms_verification_login','05 短信登录'],['sms_login_pre_filled_state','06 验证码已填写'],['01_home_device_binding','07 首页 · 设备绑定'],['your_device_smart_wearables','08 我的穿戴设备'],['03_emergency_alert_trigger','09 异常预警'],['04_confirm_alert_release','10 确认发布求助'],['05_building_search_range','11 建立搜寻范围'],['06_level_based_search_map','12 分级搜寻地图'],['police_report_dispatch','13 报警协助'],['facial_scan_verification','14 身份核验'],['recovery_success','15 寻回成功'],['event_feedback_hitl','16 事件反馈'],['community_feed_homepage','17 社区首页'],['community_post_detail','18 社区帖子详情'],['community_post_creation','19 发布帖子']];
const app=document.getElementById('app'),select=document.getElementById('pages');let current='01_home_device_binding',stack=[],state={bound:false,posts:[],comments:[]},comparing=false;
catalog.forEach(([id,name])=>{let option=document.createElement('option');option.value=id;option.textContent=name;select.append(option)});select.value=current;
function updateRef(){document.getElementById('refImage').src='references/'+current+'.png'}
function navigate(page,back=false){if(!catalog.some(([id])=>id===page))return;if(!back)stack.push(current);current=page;select.value=page;app.src='pages/'+page+'.html';if(comparing)updateRef();document.getElementById('notice').textContent='当前：'+catalog.find(([id])=>id===page)[1]}
select.addEventListener('change',()=>navigate(select.value));document.getElementById('back').onclick=()=>{if(stack.length)navigate(stack.pop(),true)};
document.getElementById('restart').onclick=()=>{state={bound:false,posts:[],comments:[]};stack=[];navigate('onboarding_1_safety_monitoring',true)};
document.getElementById('compare').onclick=()=>{comparing=!comparing;document.getElementById('reference').classList.toggle('hidden',!comparing);document.getElementById('stage').classList.toggle('compare',comparing);document.getElementById('compare').textContent=comparing?'关闭对照':'原稿对照';if(comparing)updateRef()};
window.addEventListener('message',e=>{if(e.source!==app.contentWindow||!e.data?.findTogether)return;const m=e.data;if(m.type==='navigate')navigate(m.page);if(m.type==='state')Object.assign(state,m.patch);if(m.type==='notice')document.getElementById('notice').textContent=m.text;if(m.type==='ready')app.contentWindow.postMessage({findTogether:true,type:'restore',state},'*')});
</script></body></html>
